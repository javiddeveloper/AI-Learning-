[project]
name = "session-32-rag-ingestion"
version = "0.1.0"
description = "Document ingestion pipeline exercise for RAG"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "pyright>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
typeCheckingMode = "strict"
